<svg xmlns="http://www.w3.org/2000/svg" width="960" height="388" viewBox="0 0 960 388" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"><rect x="0.5" y="0.5" width="959" height="387" rx="14" fill="#ffffff" stroke="#e5e7eb"/><text x="40" y="38" font-size="16" font-weight="700" fill="#0f172a">效能来源：VOD 澄清与 QA 验证</text><rect x="40" y="54" width="880" height="30" rx="7" fill="#f1f5f9"/><rect x="40" y="54" width="521.0" height="30" rx="7" fill="#1d4ed8"/><text x="52" y="74" font-size="12.5" font-weight="700" fill="#ffffff">59%</text><text x="573.0" y="74" font-size="12" fill="#64748b">41%</text><text x="40" y="104" font-size="11.5" fill="#64748b">VOD 澄清 + QA 验证合计占 Agent 任务 59%：两端工作由 Agent 承接，而非被省略</text><text x="40" y="143" font-size="12.5" fill="#0f172a">qa　验证</text><rect x="250" y="128" width="520.0" height="24" rx="5" fill="#059669"/><text x="779.0" y="145" font-size="13.5" font-weight="700" fill="#0f172a">16,545　<span>33%</span></text><text x="40" y="177" font-size="12.5" fill="#0f172a">vod　需求澄清</text><rect x="250" y="162" width="409.2" height="24" rx="5" fill="#1d4ed8"/><text x="668.2" y="179" font-size="13.5" font-weight="700" fill="#0f172a">13,019　<span>26%</span></text><text x="40" y="211" font-size="12.5" fill="#0f172a">issue　拆解交办</text><rect x="250" y="196" width="348.0" height="24" rx="5" fill="#60a5fa"/><text x="607.0" y="213" font-size="13.5" font-weight="700" fill="#0f172a">11,073　<span>22%</span></text><text x="40" y="245" font-size="12.5" fill="#0f172a">coding　编码</text><rect x="250" y="230" width="195.4" height="24" rx="5" fill="#f59e0b"/><text x="454.4" y="247" font-size="13.5" font-weight="700" fill="#0f172a">6,217　<span>12%</span></text><text x="40" y="279" font-size="12.5" fill="#0f172a">sre　运维</text><rect x="250" y="264" width="91.7" height="24" rx="5" fill="#cbd5e1"/><text x="350.7" y="281" font-size="13.5" font-weight="700" fill="#0f172a">2,918　<span>6%</span></text><text x="40" y="318" font-size="11.5" fill="#0f172a">▪ VOD 将模糊需求收敛为可执行任务（≤3 轮），经 A2A 交办 Issue Agent</text><text x="40" y="340" font-size="11.5" fill="#0f172a">▪ QA 验证通过方可合入 PR：8,386 条测试用例、任务完成率 90.3%</text><text x="40" y="366" font-size="11" fill="#94a3b8">编码环节仅占 12%：瓶颈不在代码生产</text></svg>