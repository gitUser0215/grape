<svg xmlns="http://www.w3.org/2000/svg" width="960" height="268" viewBox="0 0 960 268" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"><rect x="0.5" y="0.5" width="959" height="267" rx="14" fill="#ffffff" stroke="#e5e7eb"/><text x="40" y="38" font-size="16" font-weight="700" fill="#0f172a">Organisation efficiency: output per unit time</text><text x="920" y="38" text-anchor="end" font-size="11.5" fill="#64748b">last full month　→　last 5 days</text><text x="40" y="92" font-size="12.5" fill="#0f172a">Agent tasks / day (org total)</text><rect x="250" y="76" width="44.0" height="26" rx="5" fill="#bfdbfe"/><text x="304.0" y="95" font-size="14.5" font-weight="700" fill="#0f172a">901</text><rect x="470" y="76" width="150.0" height="26" rx="5" fill="#3b82f6"/><text x="630.0" y="95" font-size="14.5" font-weight="700" fill="#0f172a">3072</text><rect x="724.0" y="77" width="68" height="23" rx="11.5" fill="#1d4ed8"/><text x="758.0" y="93" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3.4x</text><text x="40" y="138" font-size="12.5" fill="#0f172a">Agent tasks / active person / day</text><rect x="250" y="122" width="35.8" height="26" rx="5" fill="#bfdbfe"/><text x="295.8" y="141" font-size="14.5" font-weight="700" fill="#0f172a">9.4</text><rect x="470" y="122" width="150.0" height="26" rx="5" fill="#3b82f6"/><text x="630.0" y="141" font-size="14.5" font-weight="700" fill="#0f172a">39.4</text><rect x="724.0" y="123" width="68" height="23" rx="11.5" fill="#1d4ed8"/><text x="758.0" y="139" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4.2x</text><text x="40" y="184" font-size="12.5" fill="#0f172a">New issues / day</text><rect x="250" y="168" width="20.1" height="26" rx="5" fill="#bfdbfe"/><text x="280.1" y="187" font-size="14.5" font-weight="700" fill="#0f172a">98</text><rect x="470" y="168" width="150.0" height="26" rx="5" fill="#1d4ed8"/><text x="630.0" y="187" font-size="14.5" font-weight="700" fill="#0f172a">733</text><rect x="724.0" y="169" width="68" height="23" rx="11.5" fill="#1d4ed8"/><text x="758.0" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">7.5x</text><text x="40" y="234" font-size="11.5" fill="#64748b">All three are normalised per day and therefore measure output rhythm, not window length: org throughput 3.4x, per person 4.2x, demand intake 7.5x</text></svg>